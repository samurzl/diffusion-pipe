# MiniMax H3 first-frame I2V LoRA training with NSYNC gradient projection.
# Fill in every path before running. NSYNC requires data-parallel world size 1.

output_dir = 'path_to_output_dir'
dataset = 'examples/minimax_h3_i2v_nsync_dataset.toml'

epochs = 1000
micro_batch_size_per_gpu = 1
image_micro_batch_size_per_gpu = 4
pipeline_stages = 1
gradient_accumulation_steps = 1
gradient_clipping = 1
warmup_steps = 10

eval_before_first_step = false
eval_every_n_epochs = 1
eval_micro_batch_size_per_gpu = 1
eval_gradient_accumulation_steps = 1

save_every_n_epochs = 1
checkpoint_every_n_minutes = 120
activation_checkpointing = 'unsloth'
partition_method = 'parameters'
save_dtype = 'bfloat16'
caching_batch_size = 1
steps_per_print = 1
video_clip_mode = 'single_beginning'
blocks_to_swap = 48
compile = false
uncond_fraction = 0

[model]
type = 'minimax_h3'
mode = 'i2v'
i2v_visual_cond_timestep = 0.999
diffusion_model = '/path/to/minimax_h3_fl2va_pruned_int8_convrot.safetensors'
vae = '/path/to/minimax_h3_video_vae_fp16.safetensors'
audio_vae = '/path/to/minimax_h3_audio_vae_fp32.safetensors'
text_encoders = [
    {path = '/path/to/qwen3vl_32b_minimax_h3_int8_convrot.safetensors', type = 'minimax'}
]
dtype = 'bfloat16'
timestep_sample_method = 'uniform'
shift = 8
image_shift = 1
cfg = 1

[adapter]
type = 'lora'
rank = 32
dtype = 'bfloat16'

[optimizer]
type = 'adamw_optimi'
lr = 1e-4
betas = [0.9, 0.99]
weight_decay = 0.01
eps = 1e-8

[training_methods.nsync]
enabled = true
eps = 1e-8
